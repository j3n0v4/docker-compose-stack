# =============================================================================
# Frigate configuration template
# =============================================================================
#
# This is a minimal reference template — not deployment-ready. Copy it to your
# .env-defined config path and fill in your camera details.
#
# All camera-specific values use placeholders. Replace ${CAMERA_HOST},
# ${CAMERA_IP}, and ${FRIGATE_RTSP_PASSWORD} with your real values before
# deploying.
#
# The FRIGATE_RTSP_PASSWORD environment variable (set in .env) is automatically
# available inside the container. Reference it in RTSP URLs as shown below.
#
# See https://docs.frigate.video/ for full configuration options.
# =============================================================================

# MQTT is optional but recommended for Home Assistant integration.
# Uncomment and configure if you run an MQTT broker.
# mqtt:
#   host: 10.0.0.10
#   port: 1883
#   user: mqtt_user
#   password: ${MQTT_PASSWORD}

cameras:
  # --- Example camera placeholder (uncomment and customize) ------------------
