# Object detection — uses the CPU by default. If you have a Coral TPU, the
# container auto-detects it via USB passthrough (see docker-compose.yml).
detectors:
  cpu:
    type: cpu

# Optional: Intel QSV hardware acceleration for ffmpeg decoding.
# Uncomment if you passed /dev/dri/renderD128 to the container.
# ffmpeg:
#   hwaccel_args: -hwaccel qsv -hwaccel_device /dev/dri/renderD128